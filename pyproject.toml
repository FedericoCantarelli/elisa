[project]
name = "elisa"
version = "0.3.0"
description = "Track bank accounts, budgets and expenses, from the el CLI or as a Python library."
readme = "README.md"
authors = [
    { name = "FedericoCantarelli", email = "fede.cantarelli98@gmail.com" }
]
requires-python = ">=3.13"
keywords = ["budget", "expenses", "finance", "ledger", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/FedericoCantarelli/elisa"
Changelog = "https://github.com/FedericoCantarelli/elisa/blob/main/CHANGELOG.md"

[project.scripts]
elisa = "elisa.cli:main"
el = "elisa.cli:main"

[dependency-groups]
dev = [
    "ruff==0.16",
    "ty>=0.0.110",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver2"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
